<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus UPHF "Fariand ville" — OMSI 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fcfcfb;--sf:#f3f3f1;--txt:#161616;--mut:#7a7a76;--line:#e6e6e2;--acc:#161616;--on:#fcfcfb}
:root[data-theme="light"]{--bg:#fcfcfb;--sf:#f3f3f1;--txt:#161616;--mut:#7a7a76;--line:#e6e6e2;--acc:#161616;--on:#fcfcfb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--sf:#181818;--txt:#f1f1ef;--mut:#8a8a86;--line:#2a2a2a;--acc:#f1f1ef;--on:#0f0f0f}}
:root[data-theme="dark"]{--bg:#0f0f0f;--sf:#181818;--txt:#f1f1ef;--mut:#8a8a86;--line:#2a2a2a;--acc:#f1f1ef;--on:#0f0f0f}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.wrap{max-width:640px;margin:auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:.92rem}
nav b{font-weight:600;letter-spacing:-.01em}
nav a{color:var(--mut);text-decoration:none;margin-left:20px;transition:color .2s}nav a:hover{color:var(--txt)}
section{padding:88px 0 0}
.hero{padding-top:96px}
.logos{display:flex;gap:8px;align-items:stretch}
.lg{display:flex;align-items:center;justify-content:center;height:34px;padding:5px 9px;border-radius:9px;border:1px solid var(--line)}
.lg img{height:100%;width:auto;display:block}
.lg.w{background:#fff}.lg.d{background:#111}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
h1{font-size:clamp(2.1rem,8vw,3.4rem);line-height:1.08;font-weight:650;letter-spacing:-.035em;margin:22px 0 16px}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);font-weight:500;margin:0 0 24px}
.lead{color:var(--mut);font-size:1.08rem;max-width:480px;margin:0 0 32px}
.btn{display:inline-block;padding:12px 24px;border-radius:99px;border:1px solid var(--acc);background:var(--acc);color:var(--on);cursor:pointer;text-decoration:none;font:inherit;font-weight:500;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);opacity:.85}.btn:disabled{opacity:.4;cursor:default}
.prog{margin-bottom:26px}
.row{display:flex;justify-content:space-between;font-size:.95rem}
.row span{color:var(--mut);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:22px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:none;color:var(--mut);padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:.9rem;transition:all .2s}
.seg button.act{background:var(--acc);color:var(--on)}
label{display:block;font-size:.8rem;color:var(--mut);margin:14px 0 4px}
input,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--txt);font:inherit;resize:vertical;transition:border-color .2s}
input:focus,textarea:focus{outline:0;border-color:var(--acc)}
.foot{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:center;margin:48px 0 6px;flex-wrap:wrap;gap:10px}
.head h2{margin:0}
.sg{padding:18px 0;border-bottom:1px solid var(--line);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.sg h3{margin:4px 0 2px;font-size:1.02rem;font-weight:600}.sg p{margin:0 0 6px;color:var(--mut)}
.meta{font-size:.8rem;color:var(--mut)}
.del{float:right;background:none;border:0;color:var(--mut);cursor:pointer;font-size:1rem}
.empty{color:var(--mut);padding:26px 0;text-align:center}
footer{color:var(--mut);font-size:.82rem;text-align:center;padding:80px 0 40px}
.a{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.a{opacity:1}}
body:not(.ready) nav .logos{visibility:hidden}
#introbg{position:fixed;inset:0;z-index:20;background:var(--bg);pointer-events:none}
#introw{position:fixed;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;pointer-events:none}
#introw .logos{gap:16px}
#introw .lg{height:68px;padding:10px 16px;border-radius:16px;opacity:0;animation:lgi .35s cubic-bezier(.2,.8,.2,1) forwards}
#introw .lg:nth-child(2){animation-delay:.08s}
@keyframes lgi{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#introbg,#introw{display:none}}
[hidden]{display:none!important}
.link{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;font-size:.88rem;text-decoration:underline;padding:6px 0}
.erow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.erow input[type=range]{flex:1;padding:0;border:0;accent-color:var(--acc);background:none}
.erow .ev{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.prog.edit{padding-bottom:6px;border-bottom:1px solid var(--line)}
</style>
</head>

<main class="wrap">
<section class="hero">
  <span class="badge"><i></i>Projet en cours</span>
  <h1>Campus UPHF "Fariand ville"</h1>
  <p class="lead">Saint Servan Métropole Université</p>
  <a class="btn" href="#idees">Proposer une idée</a>
</section>

<section id="avance">
  <h2>Avancement</h2>
  <div id="prog"></div>
  <p class="note"><button class="link" id="editp" type="button">Modifier l'avancement</button> <span id="pmsg" role="status"></span></p>
  <form class="foot" id="pwf" autocomplete="off" hidden><input id="pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe" style="max-width:220px"><button class="btn" type="submit">Valider</button><button class="link" type="button" id="pwc">Annuler</button></form>
</section>

<section id="idees">
  <h2>Suggestions</h2>
  <form class="panel" id="form" autocomplete="off">
    <div class="seg" role="group" aria-label="Type de suggestion"><button type="button" class="act" data-t="ligne">Ligne</button><button type="button" data-t="deco">Déco du campus</button></div>
    <label for="titre">Titre</label>
    <input id="titre" maxlength="80" placeholder="Ex. Ligne 5 : Gare → Bibliothèque" required>
    <label for="desc">Description</label>
    <textarea id="desc" rows="3" maxlength="600" placeholder="Arrêts, ambiance, détails…"></textarea>
    <label for="nom">Pseudo (facultatif)</label>
    <input id="nom" maxlength="40">
    <div class="foot"><button class="btn" id="send" type="submit">Envoyer</button><span class="note" id="msg" role="status"></span></div>
  </form>
  <div class="head"><h2>Idées reçues <span id="count"></span></h2>
    <div class="seg" role="group" aria-label="Filtrer"><button class="act" data-f="all">Toutes</button><button data-f="ligne">Lignes</button><button data-f="deco">Déco</button></div></div>
  <div id="list"></div>
</section>
</main>
<footer>Projet communautaire OMSI 2</footer>

<script>
const SB='https://lseentzeeftcsjaxlaaz.supabase.co/rest/v1',KEY='sb_publishable_7aT1YUALUDgE5uy9K2wTSw_VB-eZPIY';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=t=>{const d=document.createElement('div');d.textContent=t;return d.innerHTML};
const q=t=>esc(t).replace(/"/g,'&quot;');
const api=async(path,opt={})=>{
  const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})}});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(_){}
  if(!r.ok)throw new Error((j&&j.message)||r.status);
  return j;
};

/* Intro : logos grands puis vol vers la barre */
(async()=>{
 const nl=$('nav .logos');
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){document.body.classList.add('ready');return}
 const bg=document.createElement('div');bg.id='introbg';
 const w=document.createElement('div');w.id='introw';
 const big=nl.cloneNode(true);w.appendChild(big);document.body.append(bg,w);
 const done=()=>{bg.remove();w.remove();document.body.classList.add('ready')};
 setTimeout(done,1600);
 try{await Promise.all([...big.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})))}catch(e){}
 const r1=big.getBoundingClientRect(),r2=nl.getBoundingClientRect();
 const k=r2.height/r1.height,dx=r2.left+r2.width/2-(r1.left+r1.width/2),dy=r2.top+r2.height/2-(r1.top+r1.height/2);
 bg.animate([{opacity:1},{opacity:0}],{duration:400,delay:450,fill:'forwards',easing:'ease'});
 big.style.transformOrigin='center';
 big.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) scale(${k})`}],{duration:400,delay:450,fill:'forwards',easing:'cubic-bezier(.65,0,.35,1)'}).finished.then(done).catch(done);
})();
$$('nav .wrap>div:last-child,.badge,h1,.lead,.hero .btn,#avance>*,#idees h2,#form').forEach((e,i)=>{e.classList.add('a');e.style.animationDelay=(.5+i*.07)+'s'});

/* Etat */
let prog=[{n:"Carte du campus",p:60},{n:"Lignes de bus",p:35},{n:"Bâtiments et décors",p:45},{n:"Tests et optimisation",p:15}],draft=null;
let type='ligne',filt='all',items=[],pwd=null;

/* Avancement */
function renderProg(){
  if(draft){
    $('#prog').innerHTML=draft.map((x,i)=>`<div class="prog edit" data-i="${i}"><div class="erow"><input class="en" value="${q(x.n)}" maxlength="40" aria-label="Nom"><button type="button" class="del" data-del="${i}" aria-label="Supprimer">✕</button></div><div class="erow"><input type="range" class="er" min="0" max="100" value="${x.p}" aria-label="Pourcentage"><b class="ev">${x.p}%</b></div></div>`).join('')+'<div class="foot"><button type="button" class="btn" id="psave">Enregistrer</button><button type="button" class="link" id="padd">+ Ajouter</button><button type="button" class="link" id="pcancel">Annuler</button></div>';
    return;
  }
  $('#prog').innerHTML=prog.map(x=>`<div class="prog"><div class="row"><span style="color:var(--txt)">${esc(x.n)}</span><span>${x.p}%</span></div><div class="bar"><b data-w="${x.p}"></b></div></div>`).join('');
  setTimeout(()=>$$('#prog [data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),Math.max(30,900-performance.now()));
}
renderProg();
api('/progress?select=items&id=eq.1').then(r=>{if(r&&r[0]&&Array.isArray(r[0].items)&&r[0].items.length){prog=r[0].items;if(!draft)renderProg()}}).catch(()=>{});

$('#prog').addEventListener('input',e=>{const r=e.target.closest('.prog');if(!r||!draft)return;const i=+r.dataset.i;
  if(e.target.classList.contains('en'))draft[i].n=e.target.value;
  if(e.target.classList.contains('er')){draft[i].p=+e.target.value;r.querySelector('.ev').textContent=e.target.value+'%'}});
$('#prog').addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.del!==undefined){draft.splice(+t.dataset.del,1);renderProg()}
  else if(t.id==='padd'){draft.push({n:'Nouvelle étape',p:0});renderProg()}
  else if(t.id==='pcancel'){draft=null;renderProg();$('#editp').hidden=false}
  else if(t.id==='psave'){
    const clean=draft.map(x=>({n:(x.n||'').trim()||'Sans titre',p:Math.max(0,Math.min(100,Math.round(x.p)))}));
    t.disabled=true;
    try{await api('/rpc/save_progress',{method:'POST',body:JSON.stringify({pwd,new_items:clean})});prog=clean;draft=null;renderProg();$('#editp').hidden=false;$('#pmsg').textContent='Avancement enregistré.'}
    catch(_){t.disabled=false;$('#pmsg').textContent='Échec de l\u2019enregistrement.'}
  }
});

/* Mot de passe (vérifié côté serveur) */
const startEdit=()=>{draft=prog.map(x=>({...x}));$('#editp').hidden=true;$('#pwf').hidden=true;$('#pmsg').textContent='';renderProg()};
$('#editp').onclick=()=>{if(pwd)return startEdit();$('#pwf').hidden=false;$('#pw').value='';$('#pw').focus();$('#pmsg').textContent=''};
$('#pwc').onclick=()=>{$('#pwf').hidden=true};
$('#pwf').onsubmit=async e=>{
  e.preventDefault();const p=$('#pw').value;
  try{await api('/rpc/save_progress',{method:'POST',body:JSON.stringify({pwd:p,new_items:prog})});pwd=p;startEdit();render()}
  catch(err){$('#pmsg').textContent=/mot de passe/i.test(err.message)?'Mot de passe incorrect.':'Connexion impossible.';$('#pw').select()}
};

/* Suggestions */
const seg=(sel,fn)=>$$(sel).forEach(b=>b.onclick=()=>{$$(sel).forEach(x=>x.classList.toggle('act',x===b));fn(b)});
seg('[data-t]',b=>type=b.dataset.t);
seg('[data-f]',b=>{filt=b.dataset.f;render()});
function render(){
  const l=items.filter(i=>filt==='all'||i.type===filt);
  $('#count').textContent=items.length?'· '+items.length:'';
  $('#list').innerHTML=l.length?l.map(i=>`<article class="sg">${pwd?`<button class="del" data-id="${esc(i.id)}" aria-label="Supprimer">✕</button>`:''}<span class="meta">${i.type==='ligne'?'Ligne':'Déco'}</span><h3>${esc(i.titre)}</h3>${i.descr?`<p>${esc(i.descr)}</p>`:''}<span class="meta">${esc(i.nom||'Anonyme')} · ${new Date(i.created_at).toLocaleDateString('fr-FR')}</span></article>`).join(''):'<p class="empty">Aucune suggestion pour l\u2019instant. Lancez-vous !</p>';
}
$('#list').onclick=async e=>{const b=e.target.closest('.del');if(!b||!pwd)return;
  try{await api('/rpc/delete_suggestion',{method:'POST',body:JSON.stringify({pwd,sid:b.dataset.id})});await loadSug()}catch(_){}};
async function loadSug(){try{items=await api('/suggestions?select=id,type,titre,descr,nom,created_at&order=created_at.desc&limit=200')||[];render()}catch(_){$('#msg').textContent='Connexion impossible pour le moment.'}}
loadSug();
setInterval(()=>{if(!document.hidden)loadSug()},30000);

$('#form').onsubmit=async e=>{
  e.preventDefault();
  const titre=$('#titre').value.trim();if(!titre)return;
  $('#send').disabled=true;
  try{
    await api('/suggestions',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({type,titre,descr:$('#desc').value.trim(),nom:$('#nom').value.trim()})});
    $('#titre').value='';$('#desc').value='';$('#msg').textContent='Merci, c\u2019est enregistré.';await loadSug();
  }catch(_){$('#msg').textContent='Échec de l\u2019enregistrement, réessayez.'}
  $('#send').disabled=false;
};
</script>
</body>
</html>
